# Desarrollo local con Docker. Para el día a día alcanza con `npm run dev` (no hace falta Docker).
#   docker compose up --build                 → la app en http://localhost:3000
#   docker compose --profile minio up --build → además MinIO (adjuntos en S3) en http://localhost:9001
services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      ADMIN_EMAIL: soporte@venturebyte.com.ar
      ADMIN_PASSWORD: cambiar-esta-clave
      # Para guardar los adjuntos en MinIO (perfil "minio"), descomentar:
      # ADJUNTOS_DRIVER: s3
      # S3_ENDPOINT: http://minio:9000
      # S3_BUCKET: fondo-rotatorio
      # S3_ACCESS_KEY: minioadmin
      # S3_SECRET_KEY: minioadmin
    volumes:
      - datos:/app/data

  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio:/data

volumes:
  datos:
  minio:
