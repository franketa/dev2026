<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ingresar · Fondo rotatorio · Círculo de Oficiales FAA</title>
  <meta name="theme-color" content="#12406E">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="login">
    <div>
      <form class="login__caja form" id="login" novalidate>
        <div class="login__marca">
          <img class="login__escudo" src="/assets/img/escudo-320.png" alt="Escudo del Círculo de la Fuerza Aérea" width="112" height="112">
          <div><strong>Círculo de Oficiales de la Fuerza Aérea</strong><small>Fondo rotatorio de las sedes</small></div>
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" required autofocus>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="aviso aviso--mal" id="error" hidden></p>
        <button class="btn btn--principal btn--grande btn--ancho" type="submit">Entrar</button>
      </form>
      <p class="login__pie">¿Olvidaste la contraseña? Pedile a la Sede Central que te la blanquee.</p>
    </div>
  </main>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
